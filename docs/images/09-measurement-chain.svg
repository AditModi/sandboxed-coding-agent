<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="700" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">Why loosening one rule locks the broker</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Each value is computed from the one before. Change anything on the left and the right side stops matching.</text><rect x="50" y="170" width="225" height="250" rx="14" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2"/><text x="70" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1B2433" text-anchor="start">broker image</text><text x="70" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">app.py, rules.py</text><text x="70" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">broker-policy.json</text><text x="70" y="330" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">pinned libraries</text><line x1="277" y1="295" x2="298" y2="295" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="300" y="170" width="225" height="250" rx="14" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2"/><text x="320" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1B2433" text-anchor="start">image digest</text><text x="320" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">sha256 in ECR</text><text x="320" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">the pod uses the</text><text x="320" y="330" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">digest, not a tag</text><line x1="527" y1="295" x2="548" y2="295" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="550" y="170" width="225" height="250" rx="14" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2"/><text x="570" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1B2433" text-anchor="start">Cedar policy</text><text x="570" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">pins digest, env,</text><text x="570" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">args, mounts, user</text><text x="570" y="330" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">(genpolicy)</text><line x1="777" y1="295" x2="798" y2="295" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="800" y="170" width="225" height="250" rx="14" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="2"/><text x="820" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#5B3FB0" text-anchor="start">PCR17</text><text x="820" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">measured inside the</text><text x="820" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">sandbox, signed by</text><text x="820" y="330" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">the Nitro module</text><line x1="1027" y1="295" x2="1048" y2="295" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="1050" y="170" width="225" height="250" rx="14" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="2"/><text x="1070" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#5B3FB0" text-anchor="start">KMS key policy</text><text x="1070" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">Decrypt only if</text><text x="1070" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">PCR17 matches and</text><text x="1070" y="330" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">PCR8 is EKS-signed</text><line x1="1277" y1="295" x2="1298" y2="295" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="1300" y="170" width="225" height="250" rx="14" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="2"/><text x="1320" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#5B3FB0" text-anchor="start">GitHub token</text><text x="1320" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">encrypted to this</text><text x="1320" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">sandbox's own key</text><text x="1320" y="330" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start"></text><rect x="50" y="470" width="1500" height="170" rx="14" fill="#FBE9E5" stroke="#B83A26" stroke-width="2"/><text x="80" y="520" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#B83A26" text-anchor="start">Experiment 7: an insider removes ".github/" from denied_path_prefixes and redeploys properly.</text><text x="80" y="562" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">New image → new digest → new policy → new PCR17 → KMS refuses → the broker exits and opens nothing.</text><text x="80" y="600" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">To finish the job, the insider also needs kms:PutKeyPolicy on this key: a separate permission, logged in CloudTrail.</text></svg>