<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">The test system: three trust zones for one coding agent</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">One EKS Auto Mode cluster. Outside it: Amazon Bedrock, AWS KMS and GitHub.</text><rect x="40" y="150" width="1090" height="800" rx="22" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="8 6"/><text x="70" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#5B6475" text-anchor="start">EKS cluster (Auto Mode, Kubernetes 1.36)</text><rect x="80" y="230" width="330" height="260" rx="14" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="110" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#1B2433" text-anchor="start">Brain</text><text x="110" y="308" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">ordinary pod · agent-brain</text><text x="110" y="350" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">agent loop on Bedrock</text><text x="110" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">repo: public download</text><text x="110" y="404" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">no GitHub token</text><text x="110" y="431" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">can create pods only in</text><text x="110" y="458" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">agent-hands</text><rect x="80" y="600" width="480" height="320" rx="16" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="3"/><text x="110" y="648" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#0B7A6B" text-anchor="start">Hands</text><text x="110" y="678" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#0B7A6B" text-anchor="start">isolated-sandbox + network-isolated</text><text x="110" y="722" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">one VM per agent session</text><text x="110" y="754" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">repo files, tests, model's commands</text><text x="110" y="786" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">loopback only, no route, no DNS</text><text x="110" y="818" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">admission policy forces this spec</text><text x="110" y="850" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">deleted at the end of the session</text><rect x="620" y="400" width="470" height="480" rx="16" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="3"/><text x="650" y="450" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#5B3FB0" text-anchor="start">Broker</text><text x="650" y="480" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#5B3FB0" text-anchor="start">confidential-sandbox</text><text x="650" y="530" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">the only holder of the GitHub token</text><text x="650" y="564" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">token released by KMS after attestation</text><text x="650" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">rules baked into the image:</text><text x="650" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">  new branch under agent/ only</text><text x="650" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">  never .github/ or CODEOWNERS</text><text x="650" y="700" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">  never a different repo or base</text><text x="650" y="734" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1B2433" text-anchor="start">kubectl exec denied by Cedar policy</text><g transform="translate(1045,450) scale(0.9)"><path d="M-14,-4 v-10 a14,14 0 0 1 28,0 v10" fill="none" stroke="#5B3FB0" stroke-width="5"/><rect x="-22" y="-6" width="44" height="34" rx="6" fill="#5B3FB0"/><circle cx="0" cy="8" r="5" fill="#FFFFFF"/></g><rect x="1200" y="230" width="350" height="130" rx="14" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="1230" y="288" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1B2433" text-anchor="start">Amazon Bedrock</text><text x="1230" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#5B6475" text-anchor="start">the model</text><rect x="1200" y="470" width="350" height="130" rx="14" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="1230" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1B2433" text-anchor="start">AWS KMS</text><text x="1230" y="562" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#5B6475" text-anchor="start">checks the attestation</text><rect x="1200" y="720" width="350" height="130" rx="14" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="1230" y="778" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1B2433" text-anchor="start">GitHub</text><text x="1230" y="812" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#5B6475" text-anchor="start">PRs only via the broker</text><line x1="412" y1="290" x2="1196" y2="290" stroke="#5B6475" stroke-width="2.5" marker-end="url(#a5B6475)"/><text x="800" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#5B6475" text-anchor="middle">Converse API</text><line x1="240" y1="492" x2="240" y2="596" stroke="#0B7A6B" stroke-width="2.5" marker-end="url(#a0B7A6B)"/><text x="254" y="540" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#0B7A6B" text-anchor="start">kubectl exec over vsock</text><line x1="412" y1="460" x2="616" y2="500" stroke="#5B3FB0" stroke-width="2.5" marker-end="url(#a5B3FB0)"/><text x="420" y="520" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#5B3FB0" text-anchor="start">POST /pull-requests</text><line x1="1092" y1="535" x2="1196" y2="535" stroke="#5B3FB0" stroke-width="2.5" marker-end="url(#a5B3FB0)"/><text x="1145" y="505" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#5B3FB0" text-anchor="middle">attested</text><text x="1145" y="523" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#5B3FB0" text-anchor="middle">Decrypt</text><line x1="1092" y1="790" x2="1196" y2="790" stroke="#5B3FB0" stroke-width="2.5" marker-end="url(#a5B3FB0)"/><text x="1145" y="760" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#5B3FB0" text-anchor="middle">HTTPS +</text><text x="1145" y="778" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#5B3FB0" text-anchor="middle">token</text></svg>