<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="930" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">Where a Nitro Sandbox fits</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Three ways to get a hardware boundary on AWS. Source: AWS Compute Blog, 10 Nov 2026.</text><rect x="330" y="140" width="300" height="750" rx="16" fill="#F3F5F8" stroke="#1B2433" stroke-width="2"/><text x="350" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1B2433" text-anchor="start">EC2 instance</text><text x="350" y="213" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#5B6475" text-anchor="start">a whole VM</text><rect x="645" y="140" width="300" height="750" rx="16" fill="#FFF4DC" stroke="#9A6200" stroke-width="2"/><text x="665" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#9A6200" text-anchor="start">Nitro Enclave</text><text x="665" y="213" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#5B6475" text-anchor="start">since 2020</text><rect x="960" y="140" width="300" height="750" rx="16" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2"/><text x="980" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#0B7A6B" text-anchor="start">Nitro Sandbox</text><text x="980" y="213" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#5B6475" text-anchor="start">isolated mode on EKS</text><rect x="1275" y="140" width="300" height="750" rx="16" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="2"/><text x="1295" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#5B3FB0" text-anchor="start">Nitro Sandbox</text><text x="1295" y="213" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#5B6475" text-anchor="start">confidential mode on EKS</text><text x="60" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="start">Unit of isolation</text><line x1="60" y1="242" x2="1550" y2="242" stroke="#C9CFDA" stroke-width="1"/><text x="350" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">one instance</text><text x="665" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">carved from an instance</text><text x="980" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">one pod, child of an instance</text><text x="1295" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">one pod, child of an instance</text><text x="60" y="382" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="start">CPU</text><line x1="60" y1="344" x2="1550" y2="344" stroke="#C9CFDA" stroke-width="1"/><text x="350" y="382" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">its own vCPUs</text><text x="665" y="382" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">dedicated full cores</text><text x="980" y="382" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">time-shared with parent</text><text x="1295" y="382" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">time-shared with parent</text><text x="60" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="start">Network and disk</text><line x1="60" y1="446" x2="1550" y2="446" stroke="#C9CFDA" stroke-width="1"/><text x="350" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">ENI, EBS, instance store</text><text x="665" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">none: vsock channel only</text><text x="980" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">virtio net and block</text><text x="1295" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">virtio net and block</text><text x="60" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="start">Who is trusted</text><line x1="60" y1="548" x2="1550" y2="548" stroke="#C9CFDA" stroke-width="1"/><text x="350" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">you and your admins</text><text x="665" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">only the enclave code</text><text x="980" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">the node (exec, logs work)</text><text x="1295" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">only the pod (no exec)</text><text x="60" y="688" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="start">Attestation to KMS</text><line x1="60" y1="650" x2="1550" y2="650" stroke="#C9CFDA" stroke-width="1"/><text x="350" y="688" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">no</text><text x="665" y="688" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">yes</text><text x="980" y="688" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">no</text><text x="1295" y="688" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">yes (PCR17 = policy)</text><text x="60" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="start">Good for</text><line x1="60" y1="752" x2="1550" y2="752" stroke="#C9CFDA" stroke-width="1"/><text x="350" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">anything</text><text x="665" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">keys and crypto only</text><text x="980" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">untrusted code, CI jobs</text><text x="1295" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">secrets, tenant data</text></svg>