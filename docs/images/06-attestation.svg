<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">How the broker gets the GitHub token without anyone else seeing it</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Attested kms:Decrypt. The code is AttestedRecipient from the AWS blueprints, used unchanged.</text><rect x="70" y="140" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#5B3FB0" stroke-width="2.5"/><text x="220" y="181" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B3FB0" text-anchor="middle">broker process</text><line x1="220" y1="206" x2="220" y2="860" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="6 6"/><rect x="510" y="140" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#9A6200" stroke-width="2.5"/><text x="660" y="181" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#9A6200" text-anchor="middle">Nitro Secure Module</text><line x1="660" y1="206" x2="660" y2="860" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="6 6"/><rect x="950" y="140" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#1B2433" stroke-width="2.5"/><text x="1100" y="181" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1B2433" text-anchor="middle">AWS KMS</text><line x1="1100" y1="206" x2="1100" y2="860" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="6 6"/><circle cx="180" cy="260" r="17" fill="#5B3FB0"/><text x="180" y="267" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="234" y="236" width="520" height="46" rx="10" fill="#FFFFFF" stroke="#5B3FB0" stroke-width="1.5"/><text x="250" y="266" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">make a fresh RSA key pair, in memory only</text><circle cx="180" cy="350" r="17" fill="#9A6200"/><text x="180" y="357" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="220" y1="350" x2="654" y2="350" stroke="#9A6200" stroke-width="3" marker-end="url(#a9A6200)"/><text x="440.0" y="336" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#9A6200" text-anchor="middle">/dev/nsm: sign my measurements and my public key</text><circle cx="180" cy="430" r="17" fill="#9A6200"/><text x="180" y="437" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="660" y1="430" x2="226" y2="430" stroke="#9A6200" stroke-width="3" marker-end="url(#a9A6200)"/><text x="440.0" y="416" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#9A6200" text-anchor="middle">attestation document: PCR0, PCR8, PCR17 + public key</text><circle cx="180" cy="520" r="17" fill="#5B3FB0"/><text x="180" y="527" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="220" y1="520" x2="1094" y2="520" stroke="#5B3FB0" stroke-width="3" marker-end="url(#a5B3FB0)"/><text x="660.0" y="506" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#5B3FB0" text-anchor="middle">kms:Decrypt(ciphertext, Recipient = attestation document)</text><circle cx="1140" cy="600" r="17" fill="#1B2433"/><text x="1140" y="607" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="700" y="576" width="386" height="46" rx="10" fill="#FFFFFF" stroke="#1B2433" stroke-width="1.5"/><text x="716" y="606" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">PCR17 + PCR8 match the key policy?</text><circle cx="180" cy="690" r="17" fill="#1B2433"/><text x="180" y="697" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="1100" y1="690" x2="226" y2="690" stroke="#1B2433" stroke-width="3" marker-end="url(#a1B2433)"/><text x="660.0" y="676" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#1B2433" text-anchor="middle">CiphertextForRecipient: token encrypted to that public key</text><circle cx="180" cy="780" r="17" fill="#5B3FB0"/><text x="180" y="787" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="234" y="756" width="520" height="46" rx="10" fill="#FFFFFF" stroke="#5B3FB0" stroke-width="1.5"/><text x="250" y="786" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">open it with the private key, which never left the process</text><rect x="1180" y="660" width="380" height="200" rx="12" fill="#FBE9E5" stroke="#B83A26" stroke-width="2"/><text x="1200" y="698" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">The node carries these calls</text><text x="1200" y="725" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">but sees only ciphertext. It</text><text x="1200" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">never holds the private key,</text><text x="1200" y="779" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">so it cannot open step 6.</text><text x="1200" y="806" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">Same for anyone holding the</text><text x="1200" y="833" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">broker's IAM role elsewhere.</text></svg>