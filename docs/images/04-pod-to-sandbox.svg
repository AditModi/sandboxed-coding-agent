<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">What happens when a pod asks for runtimeClassName: isolated-sandbox</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Components from the Amazon EKS User Guide, 'How it works'. Same path for confidential-sandbox.</text><rect x="50" y="150" width="700" height="660" rx="22" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="8 6"/><text x="80" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B6475" text-anchor="start">Parent EC2 instance (the EKS node)</text><rect x="100" y="225" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="130" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">kubelet</text><text x="130" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">sees runtimeClassName on the pod</text><line x1="400" y1="327" x2="400" y2="361" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="100" y="365" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="130" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">containerd</text><text x="130" y="442" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">the node's container runtime</text><line x1="400" y1="467" x2="400" y2="501" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="100" y="505" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="130" y="550" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">containerd-shim-nitro-sandbox-v2</text><text x="130" y="582" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">launches one sandbox per pod</text><line x1="400" y1="607" x2="400" y2="641" stroke="#1B2433" stroke-width="2.5" marker-end="url(#a1B2433)"/><rect x="100" y="645" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="130" y="690" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">Firecracker</text><text x="130" y="722" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">VMM with virtio-vsock, -blk, -net</text><rect x="850" y="150" width="700" height="660" rx="22" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="3"/><text x="880" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#0B7A6B" text-anchor="start">Nitro Sandbox (a first-level guest VM, one per pod)</text><rect x="900" y="225" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#0B7A6B" stroke-width="2"/><text x="930" y="270" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">nitro-sandbox-agent</text><text x="930" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">checks the pod's Cedar policy first</text><line x1="1200" y1="327" x2="1200" y2="361" stroke="#0B7A6B" stroke-width="2.5" marker-end="url(#a0B7A6B)"/><rect x="900" y="365" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#0B7A6B" stroke-width="2"/><text x="930" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">containerd (inside)</text><text x="930" y="442" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">loads the images into the guest</text><line x1="1200" y1="467" x2="1200" y2="501" stroke="#0B7A6B" stroke-width="2.5" marker-end="url(#a0B7A6B)"/><rect x="900" y="505" width="600" height="100" rx="12" fill="#FFFFFF" stroke="#0B7A6B" stroke-width="2"/><text x="930" y="550" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#1B2433" text-anchor="start">your containers</text><text x="930" y="582" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">share the guest kernel only</text><rect x="900" y="655" width="600" height="100" rx="12" fill="#0B7A6B" stroke="#0B7A6B" stroke-width="2"/><text x="1200" y="700" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">guest Linux kernel</text><text x="1200" y="730" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#BFEDE5" text-anchor="middle">owned by this pod alone</text><line x1="702" y1="705" x2="896" y2="705" stroke="#0B7A6B" stroke-width="3" marker-end="url(#a0B7A6B)"/><text x="800" y="690" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#0B7A6B" text-anchor="middle">boots</text><text x="800" y="735" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#0B7A6B" text-anchor="middle">vsock</text><rect x="50" y="840" width="1500" height="120" rx="14" fill="#121A2B" stroke="#121A2B" stroke-width="2"/><text x="800" y="892" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Nitro Hypervisor</text><text x="800" y="930" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#AEB8CC" text-anchor="middle">enforces CPU and memory isolation between the parent and every sandbox, in hardware</text></svg>