<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">The problem Nitro Sandboxes solve</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Same EC2 node, same pods. On the left they share one Linux kernel. On the right each pod has its own.</text><rect x="50" y="150" width="730" height="690" rx="22" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="8 6"/><text x="80" y="195" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1B2433" text-anchor="start">Ordinary pods (runc)</text><text x="80" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">one EC2 instance, EKS node</text><rect x="90" y="305" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="180" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">container</text><text x="180" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5B6475" text-anchor="middle">agent session A</text><line x1="180" y1="428" x2="180" y2="470" stroke="#B83A26" stroke-width="2.5" marker-end="url(#aB83A26)"/><rect x="320" y="305" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="410" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">container</text><text x="410" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5B6475" text-anchor="middle">agent session B</text><line x1="410" y1="428" x2="410" y2="470" stroke="#B83A26" stroke-width="2.5" marker-end="url(#aB83A26)"/><rect x="550" y="305" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="640" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">container</text><text x="640" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5B6475" text-anchor="middle">some other team</text><line x1="640" y1="428" x2="640" y2="470" stroke="#B83A26" stroke-width="2.5" marker-end="url(#aB83A26)"/><rect x="90" y="475" width="650" height="110" rx="12" fill="#FBE9E5" stroke="#B83A26" stroke-width="2.5"/><text x="415" y="520" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#B83A26" text-anchor="middle">ONE shared Linux kernel</text><text x="415" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="middle">a bug reachable from one pod is reachable from all</text><rect x="80" y="620" width="670" height="80" rx="12" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="415" y="668" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">Nitro Hypervisor (hardware-enforced CPU and memory)</text><text x="80" y="745" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#B83A26" text-anchor="start">What you rely on:</text><text x="80" y="777" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">namespaces, cgroups, seccomp on one kernel</text><text x="80" y="803" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">cluster-admin can exec into any pod</text><text x="80" y="829" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">the node can read every pod's memory</text><rect x="820" y="150" width="730" height="690" rx="22" fill="#F3F5F8" stroke="#C9CFDA" stroke-width="2" stroke-dasharray="8 6"/><text x="850" y="195" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1B2433" text-anchor="start">Sandboxed pods (runtimeClassName)</text><text x="850" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">one EC2 instance, EKS node</text><rect x="842" y="255" width="216" height="330" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><text x="950" y="285" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#0B7A6B" text-anchor="middle">Nitro Sandbox (VM)</text><rect x="860" y="305" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="950" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">container</text><text x="950" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5B6475" text-anchor="middle">agent session A</text><rect x="860" y="445" width="180" height="120" rx="10" fill="#0B7A6B" stroke="#0B7A6B" stroke-width="2"/><text x="950" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">its own kernel</text><text x="950" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#BFEDE5" text-anchor="middle">boots with the pod</text><rect x="1072" y="255" width="216" height="330" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><text x="1180" y="285" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#0B7A6B" text-anchor="middle">Nitro Sandbox (VM)</text><rect x="1090" y="305" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="1180" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">container</text><text x="1180" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5B6475" text-anchor="middle">agent session B</text><rect x="1090" y="445" width="180" height="120" rx="10" fill="#0B7A6B" stroke="#0B7A6B" stroke-width="2"/><text x="1180" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">its own kernel</text><text x="1180" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#BFEDE5" text-anchor="middle">boots with the pod</text><rect x="1302" y="255" width="216" height="330" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><text x="1410" y="285" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#0B7A6B" text-anchor="middle">Nitro Sandbox (VM)</text><rect x="1320" y="305" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="1410" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">container</text><text x="1410" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5B6475" text-anchor="middle">some other team</text><rect x="1320" y="445" width="180" height="120" rx="10" fill="#0B7A6B" stroke="#0B7A6B" stroke-width="2"/><text x="1410" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">its own kernel</text><text x="1410" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#BFEDE5" text-anchor="middle">boots with the pod</text><rect x="850" y="620" width="670" height="80" rx="12" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="2"/><text x="1185" y="668" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2433" text-anchor="middle">Nitro Hypervisor (hardware-enforced CPU and memory)</text><text x="850" y="745" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#0B7A6B" text-anchor="start">What changes:</text><text x="850" y="777" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">a kernel bug stays inside one pod's VM</text><text x="850" y="803" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">the node and neighbours are protected from the pod</text><text x="850" y="829" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1B2433" text-anchor="start">first-level guest, no nested virtualization</text></svg>