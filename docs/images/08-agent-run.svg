<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="820" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">One agent run, step by step</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">What scripts/03-run-agent.sh does. Green happens in the hands, purple in the broker.</text><rect x="60" y="170" width="270" height="210" rx="14" fill="#FFFFFF" stroke="#1B2433" stroke-width="2.5"/><circle cx="96" cy="210" r="17" fill="#1B2433"/><text x="96" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="82" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Brain downloads the repo</text><text x="82" y="310" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">public tarball from</text><text x="82" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">GitHub, no token</text><line x1="332" y1="275" x2="356" y2="275" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="360" y="170" width="270" height="210" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><circle cx="396" cy="210" r="17" fill="#0B7A6B"/><text x="396" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="382" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Hands session starts</text><text x="382" y="310" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">new isolated VM, no</text><text x="382" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">network</text><line x1="632" y1="275" x2="656" y2="275" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="660" y="170" width="270" height="210" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><circle cx="696" cy="210" r="17" fill="#0B7A6B"/><text x="696" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="682" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Files go in</text><text x="682" y="310" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">one exec call, base64</text><text x="682" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">argument</text><line x1="932" y1="275" x2="956" y2="275" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="960" y="170" width="270" height="210" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><circle cx="996" cy="210" r="17" fill="#0B7A6B"/><text x="996" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="982" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Model runs the tests</text><text x="982" y="310" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">3 tests fail: wrong</text><text x="982" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">grouping</text><line x1="1232" y1="275" x2="1256" y2="275" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="1260" y="170" width="270" height="210" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><circle cx="1296" cy="210" r="17" fill="#0B7A6B"/><text x="1296" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1282" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Model edits money.py</text><text x="1282" y="310" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">write_file in the hands</text><rect x="60" y="470" width="270" height="210" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><circle cx="96" cy="510" r="17" fill="#0B7A6B"/><text x="96" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="82" y="570" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Tests run again</text><text x="82" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">all pass; the hostile test</text><text x="82" y="634" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">runs too</text><line x1="332" y1="575" x2="356" y2="575" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="360" y="470" width="270" height="210" rx="14" fill="#FFFFFF" stroke="#1B2433" stroke-width="2.5"/><circle cx="396" cy="510" r="17" fill="#1B2433"/><text x="396" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="382" y="570" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Brain reads changed files</text><text x="382" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">from the hands, full</text><text x="382" y="634" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">content</text><line x1="632" y1="575" x2="656" y2="575" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="660" y="470" width="270" height="210" rx="14" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="2.5"/><circle cx="696" cy="510" r="17" fill="#5B3FB0"/><text x="696" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="682" y="570" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Broker checks the rules</text><text x="682" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">branch, paths, size,</text><text x="682" y="634" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">fields</text><line x1="932" y1="575" x2="956" y2="575" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="960" y="470" width="270" height="210" rx="14" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="2.5"/><circle cx="996" cy="510" r="17" fill="#5B3FB0"/><text x="996" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="982" y="570" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Broker opens the PR</text><text x="982" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">agent/&lt;name&gt; into main</text><line x1="1232" y1="575" x2="1256" y2="575" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)"/><rect x="1260" y="470" width="270" height="210" rx="14" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="2.5"/><circle cx="1296" cy="510" r="17" fill="#0B7A6B"/><text x="1296" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="1282" y="570" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">Hands VM is deleted</text><text x="1282" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">nothing from the session</text><text x="1282" y="634" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">remains</text><line x1="1440" y1="382" x2="200" y2="466" stroke="#1B2433" stroke-width="2" marker-end="url(#a1B2433)" stroke-dasharray="6 6"/><text x="60" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#1B2433" text-anchor="start">The model never sees the token. The token never enters the hands. The hands never touch the network.</text></svg>