<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="1080" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">Seven experiments, and what each one checks</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Each script prints PASS or FAIL lines, or the exact refusal it got.</text><text x="60" y="175" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B6475" text-anchor="start">#</text><text x="120" y="175" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B6475" text-anchor="start">Script</text><text x="560" y="175" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B6475" text-anchor="start">Question</text><text x="1100" y="175" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B6475" text-anchor="start">Answer comes from</text><line x1="50" y1="200" x2="1550" y2="200" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="238" r="17" fill="#1B2433"/><text x="78" y="245" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="120" y="245" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">e1-what-the-workload-sees.sh</text><text x="560" y="245" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">What does a pod see in each mode?</text><text x="560" y="273" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">kernel, machine, disks, network</text><text x="1100" y="245" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">runtime class</text><line x1="50" y1="315" x2="1550" y2="315" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="353" r="17" fill="#1B2433"/><text x="78" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="120" y="360" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">03-run-agent.sh</text><text x="560" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Can the agent still do its job?</text><text x="560" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">fix the bug, open a pull request</text><text x="1100" y="360" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1B2433" text-anchor="start">the whole design</text><line x1="50" y1="430" x2="1550" y2="430" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="468" r="17" fill="#0B7A6B"/><text x="78" y="475" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="120" y="475" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">e3-hostile-code.sh</text><text x="560" y="475" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Can code in the hands get out?</text><text x="560" y="503" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">DNS, TCP, metadata, credentials</text><text x="1100" y="475" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#0B7A6B" text-anchor="start">network-isolated</text><line x1="50" y1="545" x2="1550" y2="545" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="583" r="17" fill="#0B7A6B"/><text x="78" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="120" y="590" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">e4-hijacked-brain.sh</text><text x="560" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Can a hijacked brain start an</text><text x="560" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">unsandboxed pod?</text><text x="1100" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#0B7A6B" text-anchor="start">admission policy + RBAC</text><line x1="50" y1="660" x2="1550" y2="660" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="698" r="17" fill="#5B3FB0"/><text x="78" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="120" y="705" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">e5-cluster-admin.sh</text><text x="560" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Can cluster-admin read the token?</text><text x="560" y="733" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">exec, pod spec, same IAM role</text><text x="1100" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B3FB0" text-anchor="start">Cedar policy + KMS</text><line x1="50" y1="775" x2="1550" y2="775" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="813" r="17" fill="#5B3FB0"/><text x="78" y="820" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="120" y="820" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">e6-forged-requests.sh</text><text x="560" y="820" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Can a hijacked brain push</text><text x="560" y="848" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">workflows or go to main?</text><text x="1100" y="820" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B3FB0" text-anchor="start">broker rules</text><line x1="50" y1="890" x2="1550" y2="890" stroke="#C9CFDA" stroke-width="1"/><circle cx="78" cy="928" r="17" fill="#5B3FB0"/><text x="78" y="935" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="120" y="935" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="500" fill="#1B2433" text-anchor="start">e7-insider-change.sh</text><text x="560" y="935" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Can an insider loosen the rules</text><text x="560" y="963" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">and redeploy?</text><text x="1100" y="935" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B3FB0" text-anchor="start">attestation (PCR17)</text><text x="60" y="1040" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500" fill="#B83A26" text-anchor="start">Not on this list on purpose: what a compromised node can still do. The article has a section on that.</text></svg>