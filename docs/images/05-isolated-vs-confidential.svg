<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a5B6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="a0B7A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/></marker><marker id="a5B3FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FB0"/></marker><marker id="aB83A26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83A26"/></marker><marker id="a1B2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2433"/></marker><marker id="a9A6200" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6200"/></marker><marker id="aF2B84B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><text x="60" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#1B2433" text-anchor="start">Isolated or confidential: decide who you do not trust</text><text x="60" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start">Built-in Cedar policy profiles, from the Amazon EKS User Guide, 'Run a pod in confidential mode'.</text><rect x="60" y="150" width="720" height="210" rx="18" fill="#E3F4F1" stroke="#0B7A6B" stroke-width="3"/><text x="90" y="205" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#0B7A6B" text-anchor="start">isolated-sandbox</text><text x="90" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#1B2433" text-anchor="start">I don't trust the code in the pod.</text><text x="90" y="300" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Protects: the node and other pods, from the pod</text><text x="90" y="335" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#5B6475" text-anchor="start">Trust boundary: the host</text><rect x="820" y="150" width="720" height="210" rx="18" fill="#EEE9FB" stroke="#5B3FB0" stroke-width="3"/><text x="850" y="205" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#5B3FB0" text-anchor="start">confidential-sandbox</text><text x="850" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#1B2433" text-anchor="start">I don't trust the node or its operators.</text><text x="850" y="300" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">Protects: the pod's data, from the node</text><text x="850" y="335" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#5B6475" text-anchor="start">Trust boundary: the guest</text><text x="60" y="420" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B6475" text-anchor="start">Setting</text><text x="880" y="420" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#0B7A6B" text-anchor="start">isolated</text><text x="1220" y="420" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#5B3FB0" text-anchor="start">confidential</text><line x1="60" y1="435" x2="1540" y2="435" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="470" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">Pins image digest, args, env, mounts</text><text x="880" y="470" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">no</text><text x="1220" y="470" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B3FB0" text-anchor="start">yes</text><line x1="60" y1="493" x2="1540" y2="493" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">kubectl exec</text><text x="880" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">allowed</text><text x="1220" y="528" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B3FB0" text-anchor="start">denied</text><line x1="60" y1="551" x2="1540" y2="551" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">stdin</text><text x="880" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">allowed</text><text x="1220" y="586" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B3FB0" text-anchor="start">denied</text><line x1="60" y1="609" x2="1540" y2="609" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="644" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">Logs</text><text x="880" y="644" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">allowed</text><text x="1220" y="644" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">allowed</text><line x1="60" y1="667" x2="1540" y2="667" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="702" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">Instance metadata and Pod Identity</text><text x="880" y="702" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">allowed</text><text x="1220" y="702" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">allowed</text><line x1="60" y1="725" x2="1540" y2="725" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="760" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">Writable layer encrypted</text><text x="880" y="760" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">no</text><text x="1220" y="760" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B3FB0" text-anchor="start">yes</text><line x1="60" y1="783" x2="1540" y2="783" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="818" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">Cedar policy needed</text><text x="880" y="818" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">optional</text><text x="1220" y="818" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5B3FB0" text-anchor="start">required</text><line x1="60" y1="841" x2="1540" y2="841" stroke="#C9CFDA" stroke-width="1"/><text x="60" y="876" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">KMS can gate keys on PCR17</text><text x="880" y="876" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#1B2433" text-anchor="start">no</text><text x="1220" y="876" font-family="Inter,